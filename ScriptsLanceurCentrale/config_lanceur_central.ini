#	---------------------------------------------------------------------
#			LANCEUR CENTRALISE CAPAPPRO - CONFIGURATION
#	---------------------------------------------------------------------
#	Ce fichier est lu par CapAppro_CENTRAL.py (ordonnanceur) et par
#	CapAppro_GENERIQUE_EXECUTION.py (worker).
#
#	Emplacement : il est cherche a cote du script .py qui le lit.
#	Il peut etre surcharge par la variable d'environnement CAPAPPRO_CONFIG.
#
#	Interpolation etendue active : on peut referencer une autre valeur avec
#	${CLE} (meme section) ou ${section:CLE} (autre section).
#	---------------------------------------------------------------------

[env]
#	run | dev  - informatif, sert a tracer l'environnement dans les logs
environnement = run

#	---------------------------------------------------------------------
#			CHEMINS LOCAUX (machine RPA Windows)
#	---------------------------------------------------------------------
[paths]
#	Dossier de deploiement des scripts. Laisser vide pour utiliser
#	automatiquement le dossier du script en cours d'execution.
SCRIPT_FOLDER = C:\RPA\CapAppro\04-TestCentral\Scripts\
#	Librairies maison (gdrive, pylibrary, gmail)
LIBRARY_PATH = C:\RPA\python-libraries\
#	Script worker appele par l'ordonnanceur pour chaque projet
WORKER_SCRIPT = ${SCRIPT_FOLDER}CapAppro_GENERIQUE_EXECUTION.py
#	Racine des dossiers de travail (un sous-dossier par date d'execution)
BASE_DOWNLOAD_FOLDER = C:\RPA\CapAppro\04-TestCentral\downloadFolder\
#	Home du client Oracle (contient bin\ et sqlplus.exe)
ORACLE_CLIENT_HOME = C:\app\product\12.2.0\client_1
#	Dossier ou sont recopies les fichiers de travail quand un script PL/SQL
#	echoue. Laisser vide pour desactiver cette recopie (recommande : les
#	fichiers .bat generes contiennent les identifiants de connexion).
DEBUG_FOLDER =
#	Dossier temporaire utilise pour la detection d'encodage
TEMP_FOLDER = C:\Temp\

#	---------------------------------------------------------------------
#			ORDONNANCEUR CENTRAL (Google Sheet + Google Drive)
#	---------------------------------------------------------------------
[ordonnanceur]
#	Dossier Drive contenant le classeur d'ordonnancement
DRIVE_ROOT_ID = 1bkXK77bOQb8TXG69y_n_Qw9zM-Wru1BO
#	Classeur Google Sheet d'ordonnancement
SPREADSHEET_ID = 1QNJUUM8lJcHkVOQTNguInGvmI5xZX69EwUqxYL0al1Q
#	Onglet listant les projets a executer
ONGLET_LANCEUR = Feuil1
#	Onglet journal des executions (append)
ONGLET_HISTO = HistoExec
#	Onglet de correspondance configBDD -> dossier Drive des logs
ONGLET_DATA = data
#	Index (0-based) de la colonne de HistoExec portant le lien vers le log
COL_INDEX_LOG = 5
#	Jeton d'authentification utilise par la librairie gdrive
GDRIVE_TOKEN = générique

#	---------------------------------------------------------------------
#			LANCEUR LOCAL (CapAppro_LOCAL.py)
#	---------------------------------------------------------------------
#	Le lanceur local lit le plan d'execution dans un fichier Excel local
#	au lieu du Google Sheet. Un chemin relatif est resolu depuis le dossier
#	du script.
[local]
#	drive = lire le classeur sur le Drive (source a jour, comme l'ordonnanceur)
#	local = lire la copie locale ci-dessous
SOURCE = drive
#	Copie locale, utilisee si SOURCE=local ou en repli si le Drive est
#	injoignable. Chemin relatif = a cote du script. Vide = pas de repli.
FICHIER_ORDONNANCEUR = OrdonnanceurCentral (1).xlsx
ONGLET_ORDONNANCEUR = ${ordonnanceur:ONGLET_LANCEUR}
#	oui = ne lancer que les lignes marquees Execution='oui'
#	non = lancer l'IdExec demande quel que soit son statut (mise au point)
RESPECTER_COLONNE_EXECUTION = non

#	---------------------------------------------------------------------
#			EXTRACTEUR NATIF POWERSHELL (CapAppro_Local.ps1)
#	---------------------------------------------------------------------
#	Execution locale sans Python. Ne fait ni Drive, ni mail, ni HistoExec :
#	le classeur lanceur du projet et ses fichiers .sql doivent etre deposes
#	manuellement dans DOSSIER_TRAVAIL\<ProjectName>\
[powershell]
DOSSIER_TRAVAIL = C:\Temp\CapAppro\
#	Fournisseur Oracle : auto | managed | oledb | odbc
#	  managed = Oracle.ManagedDataAccess.dll (seul mode sans client Oracle)
#	  oledb   = OraOLEDB.Oracle    (client Oracle requis)
#	  odbc    = pilote ODBC Oracle (client Oracle requis)
FOURNISSEUR_ORACLE = auto
#	Chemin explicite de Oracle.ManagedDataAccess.dll. Laisser vide pour une
#	recherche automatique (a cote du script, .\lib\, puis ORACLE_CLIENT_HOME).
ODP_MANAGED_DLL =
#	Delai maximal d'une requete, en secondes
TIMEOUT_REQUETE_SECONDES = 3600

#	---------------------------------------------------------------------
#			NOTIFICATIONS
#	---------------------------------------------------------------------
[mail]
#	Destinataire des incidents de l'ordonnanceur lui-meme
MSG_TO_CENTRAL = dsin-rpa-robot1@dalkia.fr
#	Destinataire par defaut quand un projet n'a pas de ListeDeDiffusion
MSG_TO_DEFAUT = dsin-rpa-run@dalkia.fr
#	Adresse mise en copie des mails projet
MSG_TO_CC = dsin-rpa-run@dalkia.fr
#	Prefixe des sujets de mail
NOM_ROBOT_CENTRAL = [Lanceur Requêtes]
NOM_ROBOT_WORKER = [Lanceur Central]

#	---------------------------------------------------------------------
#			PARAMETRES D'EXECUTION
#	---------------------------------------------------------------------
[execution]
#	Duree maximale d'un projet, en secondes. 0 = pas de limite.
#	14400 = 4 heures. Des executions de 17 h ont deja ete constatees.
TIMEOUT_PROJET_SECONDES = 14400
#	Nombre de tentatives d'upload vers le Drive
NB_TENTATIVES_UPLOAD = 3
#	Taille de lot pour la lecture des resultats de requete Oracle
ARRAYSIZE = 1000
#	Colonnes obligatoires du fichier Excel lanceur de chaque projet
#	(l'orthographe 'rêquete' est celle du contrat metier, ne pas corriger)
COLONNES_LANCEUR = Nom rêquete,Type rêquete,Exécution,Nom fichier sortie,formatHorodatage
#	Messages de succes recherches dans la sortie sqlplus d'un script PL/SQL
MSG_PROCEDURE_OK_FR = Procédure PL/SQL terminée avec succès
MSG_PROCEDURE_OK_EN = PL/SQL procedure successfully completed

#	---------------------------------------------------------------------
#			BASES DE DONNEES
#	---------------------------------------------------------------------
#	ATTENTION : les mots de passe en clair ci-dessous doivent etre migres
#	vers des variables d'environnement ou le Credential Manager Windows.
#	Toute valeur peut deja etre surchargee par une variable d'environnement
#	nommee CAPAPPRO_<SECTION>_<CLE>, par exemple :
#	    CAPAPPRO_CONFIG_ORACLE_FINANCE_DB_PASSWORD
#	---------------------------------------------------------------------
